    <!-- Apply saved/system theme before first paint to avoid a flash -->
    <script>
      ;(function () {
        var stored = localStorage.getItem('theme')
        var dark =
          stored === 'dark' ||
          (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
